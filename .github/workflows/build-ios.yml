name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Folia iOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Capacitor CLI
        run: npm install @capacitor/cli@8.4.2 @capacitor/ios@8.4.2 --no-audit --no-fund

      - name: Create capacitor config
        run: |
          cat > capacitor.config.json << 'EOF'
          {"appId":"top.izuna.foliamajor","appName":"Folia","webDir":"dist","backgroundColor":"#09090b"}
          EOF

      - name: Build web assets
        run: FOLIA_BUILD_TARGET=capacitor VITE_NETEASE_API_BASE=https://neteasecloudmusicapi.ivelly.com npm run build

      - name: Sync Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Archive NO signing
        run: |
          cd ios/App
          xcodebuild archive \
            -workspace App.xcodeproj/project.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/Folia.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO \
            || xcodebuild archive \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -archivePath build/Folia.xcarchive \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              ENABLE_BITCODE=NO

      - name: Package IPA
        run: |
          cd ios/App
          APP=$(find build/Folia.xcarchive/Products/Applications -name "*.app" | head -1)
          mkdir -p build/export/Payload
          cp -r "$APP" build/export/Payload/
          cd build/export && zip -r Folia.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Folia.ipa-unsigned
          path: ios/App/build/export/Folia.ipa
          retention-days: 30
